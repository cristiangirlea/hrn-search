name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: bash .github/release.sh "$GITHUB_REF_NAME"
      - name: Publish binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes --verify-tag)
          if [[ $GITHUB_REF_NAME == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/hrn-search_* dist/SHA256SUMS --title "$GITHUB_REF_NAME" "${flags[@]}"
