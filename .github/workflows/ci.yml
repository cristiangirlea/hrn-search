name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n $unformatted ]]; then echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test -count=1 ./...
      - if: runner.os == 'Linux'
        run: go test -race -count=1 ./...

  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - run: bash .github/release.sh
      - name: Verify all six assets and their checksums
        working-directory: dist
        run: |
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              asset="hrn-search_0.0.0-dev_${os}_${arch}"
              if [[ $os == windows ]]; then asset+=.exe; fi
              test -s "$asset"
              echo "$asset"
            done
          done > expected
          test -s SHA256SUMS
          diff <(sort expected) <(cut -c67- SHA256SUMS | sort)
          sha256sum --check --strict SHA256SUMS
